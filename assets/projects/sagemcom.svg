<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="Industrial Data Analytics Platform — Anomaly detection, risk prediction and a multi-agent assistant over industrial data.">
  <style>
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .35 } }
    .go { animation: go 1.8s ease-in-out infinite; }
    @keyframes go { 50% { transform: translate(3px, -3px) } }
    @media (prefers-reduced-motion: reduce) { .glow, .go { animation: none } }
  </style>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15191e"/><stop offset="1" stop-color="#0e1115"/></linearGradient></defs>
  <rect x="1" y="1" width="438" height="158" rx="14" fill="url(#bg)" stroke="#2a3038"/>
  <rect class="glow" x="1" y="1" width="4" height="158" rx="2" fill="#8db3f3"/>
  <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8db3f3">INTERNSHIP · SAGEMCOM</text>
  <text x="24" y="58" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Industrial Data Analytics Platform</text>
  <text font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa4ae"><tspan x="24" y="84">Anomaly detection, risk prediction and a</tspan><tspan x="24" y="102">multi-agent assistant over industrial data.</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d1d9"><rect x="24" y="122" width="72" height="20" rx="10" fill="none" stroke="#30363d"/><text x="60" y="136" text-anchor="middle">LightGBM</text><rect x="102" y="122" width="79" height="20" rx="10" fill="none" stroke="#30363d"/><text x="141.5" y="136" text-anchor="middle">LangGraph</text><rect x="187" y="122" width="65" height="20" rx="10" fill="none" stroke="#30363d"/><text x="219.5" y="136" text-anchor="middle">FastAPI</text><rect x="258" y="122" width="51" height="20" rx="10" fill="none" stroke="#30363d"/><text x="283.5" y="136" text-anchor="middle">React</text></g>
  <g class="go"><path d="M408 26l8-8M410 18h6v6" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
