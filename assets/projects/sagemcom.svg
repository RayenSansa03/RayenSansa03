<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="Industrial Data Analytics Platform — Anomaly detection, risk prediction and a multi-agent assistant over industrial data.">
  <style>
    .card { opacity: 0; animation: rise .7s ease-out 0.0s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .35 } }
    .go { animation: go 1.8s ease-in-out infinite; }
    @keyframes go { 50% { transform: translate(3px, -3px) } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.2) } to { opacity: 1; transform: none } }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-3px) } }
    @media (prefers-reduced-motion: reduce) { .card, .pop { animation: none; opacity: 1 } .glow, .go, .float { animation: none } }
  </style>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15191e"/><stop offset="1" stop-color="#0e1115"/></linearGradient></defs>
  <g class="card">
  <rect x="1" y="1" width="438" height="158" rx="14" fill="url(#bg)" stroke="#2a3038"/>
  <rect class="glow" x="1" y="1" width="4" height="158" rx="2" fill="#8db3f3"/>
  <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8db3f3">INTERNSHIP · SAGEMCOM</text>
  <text x="24" y="58" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Industrial Data Analytics Platform</text>
  <text font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa4ae"><tspan x="24" y="84">Anomaly detection, risk prediction and a</tspan><tspan x="24" y="102">multi-agent assistant over industrial data.</tspan></text>
  <g transform="translate(24 112)"><g class="pop" style="animation-delay:0.50s"><g class="float" style="animation-delay:0s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(64 112)"><g class="pop" style="animation-delay:0.62s"><g class="float" style="animation-delay:0.35s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(104 112)"><g class="pop" style="animation-delay:0.74s"><g class="float" style="animation-delay:0.7s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(144 112)"><g class="pop" style="animation-delay:0.86s"><g class="float" style="animation-delay:1.0499999999999998s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g>
  <text x="416" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#7d8590" text-anchor="end">view on portfolio</text>
  <g class="go"><path d="M408 26l8-8M410 18h6v6" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
