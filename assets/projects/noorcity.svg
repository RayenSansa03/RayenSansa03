<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="NoorCity — Smart street lighting: YOLO traffic detection and real-time sensors.">
  <style>
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.2) translateY(14px) } to { opacity: 1; transform: none } }
    .float { animation: float 3.4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-4px) } }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 50% { transform: scale(1.18) rotate(8deg) } }
    .row { opacity: 0; animation: row .5s ease-out forwards; }
    @keyframes row { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
    .rise { opacity: 0; animation: rise .7s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .go { animation: go 1.8s ease-in-out infinite; }
    @keyframes go { 50% { transform: translate(3px, -3px) } }
    .scan { animation: scan 3.2s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateX(-160px) } 60%, 100% { transform: translateX(520px) } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(4px) } }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pop, .row, .rise { animation: none; opacity: 1 } .float, .twinkle, .go, .arrow, .caret { animation: none } .scan { display: none } }
  </style>
  
  <g class="rise" style="animation-delay:0.3s">
  <rect x="2" y="2" width="436" height="156" rx="16" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="26" y="32" font-family="Poppins, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#555">ACADEMIC · COMPUTER VISION + IOT</text>
  <text x="26" y="60" font-family="Poppins, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#111">NoorCity</text>
  <text font-family="Poppins, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#333"><tspan x="26" y="84">Smart street lighting: YOLO traffic</tspan><tspan x="26" y="102">detection and real-time sensors.</tspan></text>
  <g transform="translate(26 114)"><g class="pop" style="animation-delay:0.65s"><g class="float" style="animation-delay:0s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(66 114)"><g class="pop" style="animation-delay:0.77s"><g class="float" style="animation-delay:0.35s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(106 114)"><g class="pop" style="animation-delay:0.89s"><g class="float" style="animation-delay:0.7s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g><g transform="translate(146 114)"><g class="pop" style="animation-delay:1.01s"><g class="float" style="animation-delay:1.0499999999999998s"><image href="data:image/svg+xml;base64," width="32" height="32"/></g></g></g>
  <text x="400" y="142" font-family="Poppins, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#555" text-anchor="end">view on portfolio</text>
  <g class="go"><path d="M402 28l10-10M404 18h8v8" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="twinkle" style="animation-delay:0.8999999999999999s"><path d="M414.0 125.0L416.4 130.7L422.6 131.2L417.9 135.3L419.3 141.3L414.0 138.1L408.7 141.3L410.1 135.3L405.4 131.2L411.6 130.7Z" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/><path d="M416.6 126.1L419.1 131.2L426.7 132.8L419.2 136.7L420.5 143.9L414.7 141.4L409.4 141.6L410.3 136.0L405.2 130.2L413.5 131.5Z" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></g>
  </g>
</svg>
